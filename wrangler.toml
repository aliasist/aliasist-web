# aliasist.com (Cloudflare Pages) — production Clerk for `functions/*` (e.g. chat-messages):
#   Dashboard → Workers & Pages → aliasistabductor → Settings → Environment variables
#     CLERK_SECRET_KEY   (secret)
#     CLERK_PUBLISHABLE_KEY  (optional; public key)
# Local Pages + Functions: root `.dev.vars.example` → `.dev.vars`
# GitHub PR Reviewer integration:
#     GITHUB_TOKEN  (optional secret; read-only GitHub token for higher limits while GitHub App auth is wired)
#     GITHUB_APP_ID  (GitHub App settings page)
#     GITHUB_APP_CLIENT_ID  (GitHub App settings page; preferred JWT issuer)
#     GITHUB_APP_PRIVATE_KEY  (secret; generated PEM private key)
#     GITHUB_WEBHOOK_SECRET  (secret; must match GitHub App webhook configuration)
# Clearasist reports:
#     CLEARASIST_ADMIN_SECRET  (secret; must match the clearasist-metadata Worker ADMIN_SECRET)
#     CLEARASIST_METADATA_WORKER_URL  (optional; defaults to the production Worker URL)
#
# Other workers: see apps/llm-chat/.dev.vars.example, apps/datasist-api/.dev.vars.example, etc.
# Homepage chat:
#     CLERK_SECRET_KEY          (secret; required for signed-in visitor chat)
# Entertainment page (/entertainment) — each is optional, missing key just disables that tab:
#     TMDB_API_KEY  (secret; themoviedb.org → Settings → API — trending movies/TV)
#     RAWG_API_KEY  (secret; rawg.io/apidocs — popular games)
#     ODDS_API_KEY  (secret; the-odds-api.com — display-only sports odds, free tier is metered)
#     NASA_API_KEY  (secret; api.nasa.gov/#signUp — Astronomy Picture of the Day, 1,000 req/hour)
#     XTREAM_HOST, XTREAM_USERNAME, XTREAM_PASSWORD  (secrets; Xtream Codes panel —
#       live TV channel guide only, no stream URLs sent to the client)

name = "aliasistabductor"
pages_build_output_dir = "dist"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_APP_ID = "3909945"
GITHUB_APP_CLIENT_ID = "Iv23liyNQyBoBOh6IROQ"
# Current free Workers AI text model. The previous @cf/meta/llama-3.1-8b-instruct
# was deprecated 2026-05-30 (error 5028) — keep this pointed at a live model
# (list: `npx wrangler ai models`).
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Cloudflare Workers AI — free-tier edge LLM, no external API key. Powers the
# homepage chat (functions/api/chat.ts) without needing GROQ_API_KEY.
[ai]
binding = "AI"

[[d1_databases]]
binding = "ANALYTICS"
database_name = "aliasist-analytics"
database_id = "76035036-4ee2-45ba-865d-ab2c18089cfc"
