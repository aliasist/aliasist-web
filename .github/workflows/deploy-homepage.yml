name: Deploy Aliasist Homepage

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/aliasist-nexus/**'
      - 'scripts/sync-nexus.mjs'
      - 'public/**'
      - 'functions/**'
      - 'images/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'wrangler.toml'
      - '.github/workflows/deploy-homepage.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Nexus dependencies
        run: npm ci --prefix apps/aliasist-nexus

      - name: Build homepage
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=aliasistabductor --branch=master --commit-dirty=true
