<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aliasist</title>
  <desc id="desc">A luminous green letter A inside a violet orbital sphere.</desc>
  <defs>
    <radialGradient id="field" cx="35%" cy="24%" r="82%">
      <stop offset="0" stop-color="#183a35"/>
      <stop offset=".48" stop-color="#0b1718"/>
      <stop offset="1" stop-color="#05090b"/>
    </radialGradient>
    <linearGradient id="mark" x1="270" y1="780" x2="730" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26d879"/>
      <stop offset=".52" stop-color="#8eea68"/>
      <stop offset="1" stop-color="#d5ff83"/>
    </linearGradient>
    <linearGradient id="orbit" x1="130" y1="650" x2="900" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a53e8"/>
      <stop offset=".5" stop-color="#b974ff"/>
      <stop offset="1" stop-color="#5ce6c2"/>
    </linearGradient>
    <linearGradient id="rim" x1="170" y1="160" x2="850" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9ff91"/>
      <stop offset=".38" stop-color="#37df94"/>
      <stop offset=".72" stop-color="#9369f4"/>
      <stop offset="1" stop-color="#d69aff"/>
    </linearGradient>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#66e881" flood-opacity=".34"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="badge">
      <circle cx="512" cy="512" r="480"/>
    </clipPath>
  </defs>

  <circle cx="512" cy="512" r="472" fill="#07100f" stroke="#020505" stroke-width="20"/>
  <circle cx="512" cy="512" r="458" fill="url(#field)" stroke="url(#rim)" stroke-width="12"/>

  <g clip-path="url(#badge)">
    <g fill="none" stroke="#8eeaaf" stroke-opacity=".12" stroke-width="9">
      <ellipse cx="512" cy="512" rx="272" ry="445"/>
      <ellipse cx="512" cy="512" rx="116" ry="445"/>
      <ellipse cx="512" cy="512" rx="436" ry="176"/>
      <path d="M100 365c122 44 265 67 412 67s290-23 412-67M100 659c122-44 265-67 412-67s290 23 412 67"/>
    </g>

    <g filter="url(#markGlow)" fill="none" stroke="url(#mark)" stroke-linejoin="round">
      <path d="M306 799 512 218 718 799" stroke-width="118"/>
      <path d="m532 558 97 30" stroke-width="76" stroke-linecap="square"/>
    </g>

    <ellipse cx="512" cy="516" rx="432" ry="181" fill="none" stroke="#a969f2" stroke-opacity=".18" stroke-width="34" transform="rotate(-14 512 516)"/>
    <ellipse cx="512" cy="516" rx="432" ry="181" fill="none" stroke="url(#orbit)" stroke-width="22" transform="rotate(-14 512 516)"/>
    <ellipse cx="512" cy="505" rx="426" ry="170" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4" transform="rotate(-14 512 505)"/>
    <circle cx="866" cy="330" r="21" fill="#e1c1ff"/>
    <circle cx="866" cy="330" r="42" fill="none" stroke="#b875ff" stroke-opacity=".35" stroke-width="10"/>
  </g>
</svg>
