<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Clearasist — Remove metadata from files</title>
    <meta name="title" content="Clearasist — Remove metadata from files" />
    <meta name="description" content="Strip all metadata from images, PDFs, and Office documents locally in your browser. Nothing is uploaded. Zero metadata remaining." />
    <meta name="theme-color" content="#0F1117" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clearasist — Remove metadata from files" />
    <meta property="og:description" content="Clean metadata from images, PDFs, and Office files locally in your browser. No uploads. Zero metadata remaining." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Clearasist — Remove metadata from files" />
    <meta property="twitter:description" content="Strip all metadata locally in your browser. No uploads. Zero metadata remaining." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

    <!-- Canonical -->
    <link rel="canonical" href="https://clearasist.com" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
