<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Datasist">
  <defs>
    <radialGradient id="field_datasist" cx="35%" cy="24%" r="82%">
      <stop offset="0" stop-color="#0a1936"/>
      <stop offset=".48" stop-color="#060f22"/>
      <stop offset="1" stop-color="#02060f"/>
    </radialGradient>
    <linearGradient id="mark_datasist" x1="270" y1="780" x2="730" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset=".52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="orbit_datasist" x1="130" y1="650" x2="900" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="rim_datasist" x1="170" y1="160" x2="850" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd"/>
      <stop offset=".38" stop-color="#3b82f6"/>
      <stop offset=".72" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="markGlow_datasist" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity=".38"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="badge_datasist">
      <circle cx="512" cy="512" r="480"/>
    </clipPath>
  </defs>

  <circle cx="512" cy="512" r="472" fill="#030814" stroke="#010307" stroke-width="20"/>
  <circle cx="512" cy="512" r="458" fill="url(#field_datasist)" stroke="url(#rim_datasist)" stroke-width="12"/>

  <g clip-path="url(#badge_datasist)">
    <g fill="none" stroke="#60a5fa" stroke-opacity=".14" stroke-width="9">
      <ellipse cx="512" cy="512" rx="272" ry="445"/>
      <ellipse cx="512" cy="512" rx="116" ry="445"/>
      <ellipse cx="512" cy="512" rx="436" ry="176"/>
      <path d="M100 365c122 44 265 67 412 67s290-23 412-67M100 659c122-44 265-67 412-67s290 23 412 67"/>
    </g>

    <g filter="url(#markGlow_datasist)" fill="none" stroke="url(#mark_datasist)" stroke-linejoin="round">
      <path d="M306 799 512 218 718 799" stroke-width="118"/>
      <path d="m532 558 97 30" stroke-width="76" stroke-linecap="square"/>
    </g>

    <ellipse cx="512" cy="516" rx="432" ry="181" fill="none" stroke="#2563eb" stroke-opacity=".18" stroke-width="34" transform="rotate(-14 512 516)"/>
    <ellipse cx="512" cy="516" rx="432" ry="181" fill="none" stroke="url(#orbit_datasist)" stroke-width="22" transform="rotate(-14 512 516)"/>
    <ellipse cx="512" cy="505" rx="426" ry="170" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4" transform="rotate(-14 512 505)"/>
    <circle cx="866" cy="330" r="21" fill="#eff6ff"/>
    <circle cx="866" cy="330" r="42" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="10"/>
  </g>
</svg>