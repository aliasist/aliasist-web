<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="DataSist Logo">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B8621B" />
      <stop offset="100%" stop-color="#8C440D" />
    </linearGradient>
    <linearGradient id="ds-track" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="ds-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#ds-bg)" />
  <circle cx="512" cy="512" r="488" fill="none" stroke="#FFA24C" stroke-width="4" stroke-opacity="0.35" />

  <!-- Isometric Server Node Cube -->
  <!-- Top Face -->
  <polygon points="512,230 760,370 512,510 264,370" fill="#1C1F2E" stroke="#FFA24C" stroke-width="6" />
  <!-- Left Face -->
  <polygon points="264,370 512,510 512,790 264,650" fill="#0D0F17" stroke="#FFA24C" stroke-width="6" />
  <!-- Right Face -->
  <polygon points="512,510 760,370 760,650 512,790" fill="#141724" stroke="#FFA24C" stroke-width="6" />

  <!-- Glowing Interconnect Bus Lines forming Monogram 'D' -->
  <path d="M 370 470 L 370 700
           C 470 720, 670 690, 670 560
           C 670 430, 480 430, 370 470 Z"
        fill="none"
        stroke="url(#ds-track)"
        stroke-width="36"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#ds-glow)" />

  <!-- Server Activity Pulse LEDs -->
  <circle cx="512" cy="510" r="16" fill="#FFFBEB" filter="url(#ds-glow)" />
  <circle cx="370" cy="470" r="12" fill="#F59E0B" />
  <circle cx="370" cy="700" r="12" fill="#F59E0B" />
  <circle cx="670" cy="560" r="14" fill="#FFFBEB" />
</svg>