<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SpaceSist Logo">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B8621B" />
      <stop offset="100%" stop-color="#8C440D" />
    </linearGradient>
    <linearGradient id="ss-trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8621B" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <linearGradient id="ss-planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#ss-bg)" />
  <circle cx="512" cy="512" r="488" fill="none" stroke="#FFA24C" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Cosmic Planet -->
  <circle cx="512" cy="512" r="240" fill="url(#ss-planet)" stroke="#FFA24C" stroke-width="4" stroke-opacity="0.4" />
  <!-- Planet Craters -->
  <circle cx="450" cy="430" r="34" fill="#0A0B10" opacity="0.6" />
  <circle cx="560" cy="550" r="24" fill="#0A0B10" opacity="0.6" />
  <circle cx="430" cy="570" r="18" fill="#0A0B10" opacity="0.6" />

  <!-- The Orbital "S" Ribbon Trajectory -->
  <path d="M 680 320
           C 540 220, 360 260, 340 400
           C 320 520, 680 500, 680 660
           C 680 770, 560 810, 420 780
           L 440 710
           C 540 730, 610 700, 610 650
           C 610 540, 260 560, 260 390
           C 260 240, 480 160, 710 260
           Z"
        fill="url(#ss-trail)"
        filter="url(#ss-glow)" />

  <!-- Ascending Rocket -->
  <g transform="translate(680, 260) rotate(35)">
    <!-- Rocket Body -->
    <path d="M 0 -80 C 30 -50, 30 50, 25 80 L -25 80 C -30 50, -30 -50, 0 -80 Z" fill="#FFFBEB" stroke="#1E1610" stroke-width="6" />
    <!-- Nose Cone -->
    <path d="M 0 -80 C 18 -60, 20 -30, 0 -30 C -20 -30, -18 -60, 0 -80 Z" fill="#B8621B" />
    <!-- Fins -->
    <polygon points="-25,40 -60,85 -25,75" fill="#F59E0B" />
    <polygon points="25,40 60,85 25,75" fill="#F59E0B" />
    <!-- Porthole -->
    <circle cx="0" cy="0" r="16" fill="#0E1017" stroke="#F59E0B" stroke-width="4" />
  </g>
</svg>