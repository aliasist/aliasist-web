<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Files Abductor Logo">
  <defs>
    <linearGradient id="fa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B8621B" />
      <stop offset="100%" stop-color="#8C440D" />
    </linearGradient>
    <linearGradient id="fa-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#B8621B" stop-opacity="0.75" />
    </linearGradient>
    <filter id="fa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#fa-bg)" />
  <circle cx="512" cy="512" r="488" fill="none" stroke="#FFA24C" stroke-width="4" stroke-opacity="0.35" />

  <!-- Tractor Beam in Shape of Download Arrow -->
  <polygon points="432,380 592,380 592,560 690,560 512,780 334,560 432,560"
           fill="url(#fa-beam)"
           stroke="#FFFBEB"
           stroke-width="12"
           stroke-linejoin="round"
           filter="url(#fa-glow)" />

  <!-- UFO Saucer Hull (Top) -->
  <ellipse cx="512" cy="350" rx="320" ry="85" fill="#0D0F17" stroke="#FFFBEB" stroke-width="8" />
  <ellipse cx="512" cy="335" rx="280" ry="60" fill="#1C1F2E" stroke="#FFA24C" stroke-width="4" stroke-opacity="0.6" />
  <!-- Saucer Cockpit Dome -->
  <path d="M 390 320 C 390 220, 634 220, 634 320 Z" fill="#F59E0B" stroke="#0D0F17" stroke-width="8" opacity="0.9" />

  <!-- Saucer Lights -->
  <circle cx="280" cy="350" r="14" fill="#FFFBEB" />
  <circle cx="390" cy="370" r="16" fill="#FFFBEB" />
  <circle cx="512" cy="375" r="18" fill="#FFFBEB" />
  <circle cx="634" cy="370" r="16" fill="#FFFBEB" />
  <circle cx="744" cy="350" r="14" fill="#FFFBEB" />
</svg>